<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Platform | Authentication</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root[data-theme="light"] {
            --bg-main: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --primary: #0f172a; --primary-hover: #334155; --primary-light: #f1f5f9;
            --accent-green: #10b981; --accent-green-light: #d1fae5;
            --danger: #ef4444; --danger-light: #fee2e2;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        :root[data-theme="dark"] {
            --bg-main: #0f172a; --bg-card: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
            --primary: #ffffff; --primary-hover: #e2e8f0; --primary-light: #334155;
            --accent-green: #10b981; --accent-green-light: rgba(16, 185, 129, 0.2);
            --danger: #ef4444; --danger-light: rgba(239, 68, 68, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            transition: background-color 0.3s ease; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .auth-wrapper { width: 100%; max-width: 440px; padding: 20px; z-index: 10; }
        .saas-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 2.5rem; }
        
        .form-control-custom { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px 16px; width: 100%; transition: 0.2s; font-size: 0.95rem; }
        .form-control-custom:focus { outline: none; border-color: var(--text-main); box-shadow: 0 0 0 3px var(--primary-light); }
        .form-control-custom.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-light); }

        .btn-primary-custom { background: var(--primary); color: var(--bg-card); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary-custom:hover { background: var(--primary-hover); }
        .btn-primary-custom:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-social { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 8px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
        .btn-social:hover { background: var(--primary-light); border-color: var(--text-muted); }

        .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; margin-bottom: 6px; }
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .view-section { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .top-nav-fixed { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }
        
        .error-feedback { display: none; color: var(--danger); font-size: 0.8rem; margin-top: 4px; font-weight: 500; }
        
        /* Connection Status Badge Styles */
        .status-badge { font-size: 0.75rem; font-weight: 600; padding: 8px 12px; border-radius: 50px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); display: flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: var(--shadow-sm); }
        .status-badge.connected { background: var(--accent-green-light); color: var(--accent-green); border-color: transparent; }
        .status-badge.disconnected { background: var(--danger-light); color: var(--danger); border-color: transparent; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .status-badge.connected .status-dot { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
        .status-badge.disconnected .status-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
        
        @keyframes subtlePulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .pinging .status-dot { animation: subtlePulse 1.5s infinite; }
    </style>
</head>
<body>

    <div class="top-nav-fixed">
        <div class="status-badge pinging pointer-auto" id="connectionBadge">
            <span class="status-dot"></span>
            <span id="connectionText">Checking Backend...</span>
        </div>
        
        <button class="btn border-0 text-main bg-card shadow-sm rounded-circle p-2 d-flex align-items-center justify-content-center pointer-auto" style="width: 45px; height: 45px;" onclick="toggleTheme()">
            <i class="bi bi-moon-stars fs-5" id="themeIcon"></i>
        </button>
    </div>

    <div class="auth-wrapper">
        <div class="saas-card pointer-auto">
            <div class="text-center mb-4">
                <div class="bg-primary rounded text-white d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 48px; height: 48px;">
                    <i class="bi bi-layers-fill fs-4"></i>
                </div>
                <h3 class="fw-bold text-main mb-1" id="authTitle">Welcome back</h3>
                <p class="text-muted small" id="authSubtitle">Sign in to manage your deployments.</p>
            </div>

            <button class="btn btn-social mb-3" onclick="mockOAuth()">
                <i class="bi bi-github fs-5"></i> Continue with GitHub
            </button>

            <div class="divider">OR</div>

            <form id="authForm" novalidate>
                <div class="mb-3 view-section" id="nameFieldGroup">
                    <label class="form-label text-uppercase">Full Name</label>
                    <input type="text" class="form-control-custom" id="userName" placeholder="John Doe">
                    <div class="error-feedback" id="nameError">Please enter your name.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-uppercase">Email Address</label>
                    <input type="email" class="form-control-custom" id="userEmail" placeholder="you@example.com">
                    <div class="error-feedback" id="emailError">Please enter a valid email address.</div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-end">
                        <label class="form-label text-uppercase">Password</label>
                        <a href="#" class="text-muted small text-decoration-none view-section active" id="forgotPasswordLink" style="font-size: 0.75rem; margin-bottom: 6px;">Forgot password?</a>
                    </div>
                    <div class="position-relative">
                        <input type="password" class="form-control-custom pe-5" id="userPassword" placeholder="••••••••">
                        <button type="button" class="btn border-0 text-muted position-absolute top-50 end-0 translate-middle-y" onclick="togglePassword()">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <div class="error-feedback" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-4" id="submitBtn">
                    <span id="submitText">Sign In</span>
                    <div class="spinner-border spinner-border-sm d-none" id="submitSpinner" role="status"></div>
                </button>
            </form>

            <div class="text-center text-muted small fw-medium">
                <span id="toggleContextText">Don't have an account?</span> 
                <a href="#" class="text-main fw-bold text-decoration-none" onclick="toggleView(event)" id="toggleActionText">Sign up</a>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3 pointer-auto" style="z-index: 9999" id="toastContainer"></div>

    <script>
        let currentMode = 'login'; 
        const BACKEND_URL = 'http://127.0.0.1:5000'; // Change this if you host Python on a real server later

        // --- Theme Management ---
        function initTheme() { 
            const t = localStorage.getItem('nexus_theme') || 'light'; 
            document.documentElement.setAttribute('data-theme', t); 
            document.getElementById('themeIcon').className = t === 'dark' ? 'bi bi-sun fs-5' : 'bi bi-moon-stars fs-5'; 
        }
        function toggleTheme() { 
            const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; 
            document.documentElement.setAttribute('data-theme', t); 
            localStorage.setItem('nexus_theme', t); 
            document.getElementById('themeIcon').className = t === 'dark' ? 'bi bi-sun fs-5' : 'bi bi-moon-stars fs-5'; 
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            checkBackendConnection();
            setInterval(checkBackendConnection, 5000); // Check every 5 seconds
        });

        // --- Live Backend Connection Check ---
        async function checkBackendConnection() {
            const badge = document.getElementById('connectionBadge');
            const text = document.getElementById('connectionText');
            
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                if (response.ok) {
                    badge.className = 'status-badge connected pointer-auto';
                    text.innerText = 'Backend Connected';
                } else {
                    throw new Error('Server returned error');
                }
            } catch (error) {
                badge.className = 'status-badge disconnected pointer-auto';
                text.innerText = 'Backend Disconnected';
            }
        }

        // --- View Toggling ---
        function toggleView(e) {
            e.preventDefault();
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameField = document.getElementById('nameFieldGroup');
            const forgotPwd = document.getElementById('forgotPasswordLink');
            const submitText = document.getElementById('submitText');
            const contextText = document.getElementById('toggleContextText');
            const actionText = document.getElementById('toggleActionText');

            clearErrors(); 
            document.getElementById('authForm').reset();

            if (currentMode === 'login') {
                currentMode = 'signup';
                title.innerText = 'Create an account';
                subtitle.innerText = 'Start deploying serverless apps in seconds.';
                nameField.classList.add('active');
                forgotPwd.classList.remove('active');
                submitText.innerText = 'Create Account';
                contextText.innerText = 'Already have an account?';
                actionText.innerText = 'Sign in';
            } else {
                currentMode = 'login';
                title.innerText = 'Welcome back';
                subtitle.innerText = 'Sign in to manage your deployments.';
                nameField.classList.remove('active');
                forgotPwd.classList.add('active');
                submitText.innerText = 'Sign In';
                contextText.innerText = "Don't have an account?";
                actionText.innerText = 'Sign up';
            }
        }

        function togglePassword() {
            const pwdInput = document.getElementById('userPassword');
            const icon = document.getElementById('togglePasswordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        // --- Validation ---
        function clearErrors() {
            document.querySelectorAll('.form-control-custom').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.error-feedback').forEach(el => el.style.display = 'none');
        }

        function showError(inputId, errorId) {
            document.getElementById(inputId).classList.add('is-invalid');
            document.getElementById(errorId).style.display = 'block';
        }

        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;
            let isValid = true;

            if (currentMode === 'signup' && name.length < 2) { showError('userName', 'nameError'); isValid = false; }
            if (!validateEmail(email)) { showError('userEmail', 'emailError'); isValid = false; }
            if (password.length < 6) { showError('userPassword', 'passwordError'); isValid = false; }

            if (isValid) {
                processAuth();
            } else {
                showToast("Please fix the errors in the form.", "error");
            }
        });

        // --- Fetch API Integration ---
        async function processAuth() {
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;
            const name = document.getElementById('userName').value.trim();
            
            const btn = document.getElementById('submitBtn');
            const text = document.getElementById('submitText');
            const spinner = document.getElementById('submitSpinner');

            btn.disabled = true;
            text.classList.add('d-none');
            spinner.classList.remove('d-none');

            const endpoint = currentMode === 'login' ? '/login' : '/signup';
            const payload = currentMode === 'login' 
                ? { email: email, password: password }
                : { name: name, email: email, password: password };

            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (response.ok) {
                    showToast(result.message, 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast("Cannot connect to server. Check the connection badge.", "error");
            } finally {
                btn.disabled = false;
                text.classList.remove('d-none');
                spinner.classList.add('d-none');
            }
        }

        function mockOAuth() {
            showToast("OAuth requires additional backend setup.", "info");
        }

        function showToast(msg, type='info') { 
            const c = document.getElementById('toastContainer'); 
            const t = document.createElement('div'); 
            t.className = `toast align-items-center text-white bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'dark'} border-0 show`; 
            t.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body fw-medium d-flex align-items-center gap-2">
                        <i class="bi ${type === 'error' ? 'bi-exclamation-circle' : type === 'success' ? 'bi-check-circle' : 'bi-info-circle'}"></i> 
                        ${msg}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>`; 
            c.appendChild(t); 
            setTimeout(() => t.remove(), 4000); 
        }
    </script>
</body>
</html>
